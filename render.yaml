services:
  - type: web
    name: prepforge-server
    env: node
    plan: free

    # ── BUILD ─────────────────────────────────────────────────────────────
    # Install ONLY server dependencies. Do NOT build the frontend —
    # Vercel handles the frontend deployment.
    buildCommand: npm install --prefix server

    # ── START ─────────────────────────────────────────────────────────────
    startCommand: node server/src/server.js

    # ── ENVIRONMENT VARIABLES ─────────────────────────────────────────────
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: ENCRYPTION_KEY
        sync: false

      - key: REDIS_URL
        sync: false

      # CORS: comma-separated list of allowed frontend origins.
      # MUST match your actual Vercel frontend URL.
      - key: CORS_ORIGIN
        value: "https://prepforge-ua5k.vercel.app,http://localhost:5173"

      # CLIENT_URL is a convenience alias used if your code references it.
      - key: CLIENT_URL
        value: "https://prepforge-ua5k.vercel.app"